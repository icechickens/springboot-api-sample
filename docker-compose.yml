services:
  web:
    container_name: hello-web-web

    # ビルドコンテキスト
    build: 
      context: ./web
      target: build
    ports:
      - 3000:3000
    environment:
      - REACT_APP_API_SERVER=http://localhost:8080/api
    
    # dev containerが使えないのは、ttyがないため？
    # コンテナ起動してもbashがすぐに終了してしまうためか？
    tty: true

    # ワークスペースのマウント
    volumes:
      - ./web:/workspace:cached
    depends_on:
      - api

  api:
    container_name: hello-web-api

    # ビルドコンテキスト
    build: 
      context: ./api
      target: base
    ports:
      - 8080:8080

    # ワークスペースのマウント
    volumes:
      - ./api:/workspace:cached
    
    # 先にDBを起動してからAPIを起動する
    depends_on:
      - db

  db:
    container_name: hello-web-db
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    
    # DBのデータをボリュームに保存
    volumes:
      - db-storage:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d

# ボリュームの作成
# ボリューム名は「web-api-db-sample_db-storage」となる
volumes:
  db-storage:

# Dockerネットワークはdocker-composeが自動で作成するものを使用
# ネットワーク名は「web-api-db-sample_default」になる